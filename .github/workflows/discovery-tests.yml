name: Discovery Recorder Tests

on:
  push:
    branches:
      - feature/multilayer-discovery-recorder
  pull_request:
    branches:
      - main

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax
        run: python -m py_compile smartops_desktop/core.py smartops_desktop/discovery.py smartops_desktop/desktop_recorder.py smartops_desktop/discovery_ui.py smartops_desktop/worker.py smartops_desktop/gui.py main.py
      - name: Recorder JavaScript syntax
        run: node --check smartops_desktop/recorder.js
      - name: Tests
        run: python -m pytest tests -q -p no:cacheprovider
