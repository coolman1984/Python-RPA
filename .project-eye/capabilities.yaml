  anchor:               {capture: yes, persist: yes, review: yes, replay: no, proof: real-chromium}
  accessibility:        {capture: yes, persist: yes, review: yes, replay: no, proof: real-chromium}
  visual:               {capture: yes, persist: yes, review: yes, replay: no, proof: real-chromium}
  relative_position:    {capture: yes, persist: yes, review: yes, replay: no, proof: real-chromium}
  network_context:      {capture: yes, persist: yes, review: yes, replay: no, proof: real-chromium}
  nexacro:              {capture: yes, persist: yes, review: yes, replay: no, proof: synthetic, note: reproduction of the id shape only; never a live Nexacro runtime}
  windows_uia:          {capture: yes, persist: yes, review: yes, replay: no, proof: synthetic, note: availability check exercised; query path never executed}
  desktop_click:        {capture: yes, persist: yes, review: yes, replay: refused_loudly, proof: synthetic}
  desktop_key:          {capture: yes, persist: yes, review: yes, replay: refused_loudly, proof: synthetic}
  ocr:                  {capture: no, persist: no, review: no, replay: no, proof: none, note: adapter present, no engine bundled}
  computer_vision:      {capture: no, persist: no, review: no, replay: no, proof: none, note: NOT_IMPLEMENTED by declaration}
