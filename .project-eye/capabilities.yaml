# capture / persist / review / replay / verify, per capability. VERIFIED always names its evidence.
legend:
  proof: [none, synthetic, real-chromium, real-windows, real-nexacro]
capabilities:
  ordinary_web_click:   {capture: yes, persist: yes, review: yes, replay: yes, proof: real-chromium}
  text_input:           {capture: yes, persist: yes, review: yes, replay: yes, proof: real-chromium}
  select:               {capture: yes, persist: yes, review: yes, replay: yes, proof: real-chromium}
  checkbox:             {capture: yes, persist: yes, review: yes, replay: yes, proof: real-chromium}
  special_keys:         {capture: yes, persist: yes, review: yes, replay: yes, proof: real-chromium}
  iframe:               {capture: yes, persist: yes, review: yes, replay: partial, proof: real-chromium, note: replay uses the last frame hop only}
  nested_iframe:        {capture: yes, persist: yes, review: yes, replay: no, proof: real-chromium, note: frame_chain recorded, never consumed}
  popup_new_tab:        {capture: yes, persist: yes, review: yes, replay: no, proof: real-chromium, note: page_context recorded, never consumed}
  spa_navigation:       {capture: yes, persist: yes, review: yes, replay: n/a, proof: real-chromium}
