# A claim is only as fresh as the code behind it. Touch the paths and the proof turns STALE.
proofs:
  - id: recording-journey-end-to-end
    claim: A browser click is recorded, enriched, mirrored, saved and validates as a workflow.
    kind: real-chromium
    test: tests/test_journeys.py::test_record_enrich_mirror_save_reload
    paths: [smartops_desktop/session.py, smartops_desktop/gui.py, smartops_desktop/core.py, smartops_desktop/discovery.py, smartops_desktop/probe.js]
  - id: radar-journey-end-to-end
    claim: A pointed-at element reaches the radar card with its evidence.
    kind: real-chromium
    test: tests/test_journeys.py::test_radar_point_then_enrich_reaches_the_radar_card
    paths: [smartops_desktop/session.py, smartops_desktop/gui.py, smartops_desktop/probe.js]
  - id: target-identity-survives
    claim: Target ownership survives duplicate URLs, navigation and SPA routing.
    kind: real-chromium
    test: tests/test_targets.py
    paths: [smartops_desktop/targets.py]
  - id: capture-is-not-blocked-by-discovery
    claim: A slow detector cannot delay a recorded step reaching disk.
    kind: real-chromium
    test: tests/test_session.py::test_a_slow_detector_never_delays_the_recorded_step
    paths: [smartops_desktop/session.py]
  - id: nested-iframe-visual-correct
    claim: The element and context pictures really show the element inside nested iframes.
    kind: real-chromium
    test: tests/test_session.py::test_the_context_picture_of_a_nested_iframe_element_shows_the_element
    paths: [smartops_desktop/discovery.py, smartops_desktop/session.py]
  - id: start-url-carries-no-credentials
    claim: No credential-like URL parameter is written to disk.
    kind: synthetic
    test: tests/test_journeys.py::test_a_credential_like_parameter_never_reaches_the_disk
    paths: [smartops_desktop/session.py]
  - id: nexacro-detection
    claim: Nexacro component, form, grid, row and column are read.
    kind: synthetic
    test: tests/test_radar.py::test_nexacro_cell_reports_component_form_grid_row_and_column
    paths: [smartops_desktop/probe.js, smartops_desktop/discovery.py]
    note: A reproduction of Nexacro's rendered id shape. NOT a live G-MES runtime.
  - id: windows-native-capture
    claim: Native Windows clicks are recorded through the same pipeline.
    kind: synthetic
    test: tests/test_session.py::test_a_native_interaction_enters_the_same_pipeline_as_a_browser_one
    paths: [smartops_desktop/desktop_discovery.py, smartops_desktop/session.py]
    note: The hook declines to start off Windows. The query path has never executed.
  - id: windows-package-builds
    claim: The Windows executable builds and runs.
    kind: none
    test: null
    paths: [build.ps1, requirements.txt]
    note: Never attempted. No Windows machine in this environment.
