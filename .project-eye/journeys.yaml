journeys:
  RECORD-ACTION:
    entry: user performs an interaction in the owned target
    nodes: [probe.js, session.receive, session.pending, session.drain, session.raw_step, journal.add, worker_event.step_added, gui.mirror]
    writes: [draft.jsonl]
    terminal: step recorded, enrichment pending
    tests: [tests/test_journeys.py::test_record_enrich_mirror_save_reload, tests/test_session.py]
    proof: real-chromium
  ENRICH-ACTION:
    entry: session.tick has spare budget
    nodes: [session.enrich_backlog, DiscoveryManager.discover_element, session.evidence_patch, journal.enrich, worker_event.step_enriched, gui.mirror]
    writes: [draft.jsonl, element PNGs]
    terminal: enrichment_status complete | failed | skipped_capacity
    tests: [tests/test_journeys.py::test_an_overflowing_backlog_marks_the_step_instead_of_dropping_it_silently]
    proof: real-chromium
  RADAR-ELEMENT:
    entry: user points at an element in radar mode
    nodes: [probe.js, session.drain, worker_event.step_added, gui.add_element, session.enrich, worker_event.step_enriched, gui.update_element]
    terminal: radar card filled
    tests: [tests/test_journeys.py::test_radar_point_then_enrich_reaches_the_radar_card]
    proof: real-chromium
    limitation: radar journals are tagged radar and excluded from automation recovery
  SAVE-RECORDING:
    entry: worker exits, GUI finish_worker runs
    nodes: [DraftJournal.timeline, core.validate_workflow, Store.save, RecordingSession.close_draft]
    writes: [smartops.sqlite3, workflows/*.json, draft.json state]
    terminal: SAVED, or draft stays recoverable on failure
    tests: [tests/test_journeys.py::test_a_save_takes_the_journal_timeline_not_the_gui_mirror]
    proof: real-chromium
  RECOVER-DRAFT:
    entry: launch with an unfinished draft present
    nodes: [DraftJournal.unfinished, DraftJournal.timeline]
    terminal: offered for recovery
    tests: [tests/test_session.py::test_a_crash_during_review_is_still_recoverable]
    proof: synthetic
    limitation: no recovery UI yet; the contract exists, the screen does not
  CONNECT-TARGET:
    entry: user picks a Chrome tab
    nodes: [worker.connect, targets.list_targets, targets.page_for_target, session.choose]
    terminal: target owned by CDP target id
    tests: [tests/test_targets.py]
    proof: real-chromium
  POPUP-RECORDING:
    entry: the owned page opens a new tab
    nodes: [page.on popup, session._new_pages, session.adopt_new, session.own]
    tests: [tests/test_session.py::test_a_new_tab_opened_from_the_target_joins_the_same_session]
    proof: real-chromium
  NESTED-FRAME-RECORDING:
    entry: interaction inside nested iframes
    nodes: [probe.js frameLayer, session.page_of, VisualDetector, session.evidence_patch]
    tests: [tests/test_session.py::test_the_context_picture_of_a_nested_iframe_element_shows_the_element]
    proof: real-chromium
  REPLAY-WORKFLOW:
    entry: user runs a saved workflow
    nodes: [worker.worker_main, worker.replay]
    tests: [tests/test_core.py]
    proof: real-chromium
    limitation: replay consumes selector and frame only; locators, frame_chain and page_context are recorded but unused
  DOWNLOAD-AND-VALIDATE:
    entry: a download step runs
    nodes: [worker.replay, core.validate_xlsx]
    tests: [tests/test_core.py::test_download_uses_completed_bytes_and_ignores_filename]
    proof: synthetic
  DESKTOP-RECORDING:
    entry: a native Windows click while recording
    nodes: [DesktopInputRecorder, session.native_step, session.receive, DiscoveryManager]
    tests: [tests/test_session.py::test_a_native_interaction_enters_the_same_pipeline_as_a_browser_one]
    proof: synthetic
    limitation: never executed on Windows; the hook declines to start elsewhere
